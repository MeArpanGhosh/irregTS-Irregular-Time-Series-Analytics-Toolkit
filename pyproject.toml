[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irregts"
version = "0.1.0"
description = "Irregular time-series analysis toolkit using Structure Functions, the Discrete Correlation Function (DCF), and bootstrap significance testing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

authors = [
    { name = "Arpan Ghosh", email = "mearpanghosh@gmail.com" }
]

keywords = [
    "time-series",
    "irregular",
    "astronomy",
    "structure-function",
    "DCF",
    "discrete-correlation-function",
    "bootstrap",
    "light-curves",
    "reverberation-mapping",
    "AGN",
    "variability",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "numpydoc",
]

[project.urls]
Homepage = "https://github.com/MeArpanGhosh/irregts"
Repository = "https://github.com/MeArpanGhosh/irregts"
Issues = "https://github.com/MeArpanGhosh/irregts/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["irregts*"]
exclude = ["tests*", "sample_data*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
